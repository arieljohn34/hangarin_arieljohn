{% extends 'base.html' %}

{% block title %}Note List{% endblock %}

{% block content %}
<h1>Notes</h1>
<a href="{% url 'tasks:note_create' %}" class="btn btn-success mb-3">Add New Note</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Task</th>
            <th>Content</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for note in notes %}
        <tr>
            <td>{{ note.task.title }}</td>
            <td>{{ note.content|truncatechars:50 }}</td>
            <td>
                <a href="{% url 'tasks:note_update' note.pk %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'tasks:note_delete' note.pk %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No notes yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
