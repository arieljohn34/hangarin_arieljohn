{% extends 'base.html' %}

{% block title %}Category List{% endblock %}

{% block content %}
<h1>Categories</h1>
<a href="{% url 'tasks:category_create' %}" class="btn btn-success mb-3">Add New Category</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for category in categories %}
        <tr>
            <td>{{ category.name }}</td>
            <td>
                <a href="{% url 'tasks:category_update' category.pk %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'tasks:category_delete' category.pk %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="2">No categories yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
