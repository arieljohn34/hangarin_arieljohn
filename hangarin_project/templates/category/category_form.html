{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Edit Category{% else %}New Category{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>{% if form.instance.pk %}Edit Category{% else %}Create Category{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'tasks:category_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
