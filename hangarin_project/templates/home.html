{% extends 'base.html' %}
{% load static %}

{% block title %}Home - Hangarin{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <!-- Single Welcome Header -->
        <h1 class="display-4">Welcome to Hangarin</h1>
        <p class="lead">Manage your tasks, categories, priorities, notes, and subtasks.</p>
        <hr>
        
        <!-- Dashboard Button -->
        <div class="row mb-5 mt-4">
            <div class="col-12 text-center">
                <a href="{% url 'tasks:dashboard' %}" class="btn btn-dark btn-lg btn-block" style="max-width: 300px; margin: 0 auto;">
                    <i class="la la-dashboard"></i> Go to Dashboard
                </a>
            </div>
        </div>

        <!-- Module Navigation Buttons -->
        <div class="row text-center justify-content-center">
            <!-- Added mb-3 (margin-bottom) for better spacing on mobile when they stack -->
            <div class="col-md-2 mb-3"><a href="{% url 'tasks:task_list' %}" class="btn btn-primary btn-block">Tasks</a></div>
            <div class="col-md-2 mb-3"><a href="{% url 'tasks:category_list' %}" class="btn btn-secondary btn-block">Categories</a></div>
            <div class="col-md-2 mb-3"><a href="{% url 'tasks:priority_list' %}" class="btn btn-success btn-block">Priorities</a></div>
            <div class="col-md-2 mb-3"><a href="{% url 'tasks:note_list' %}" class="btn btn-info btn-block">Notes</a></div>
            <div class="col-md-2 mb-3"><a href="{% url 'tasks:subtask_list' %}" class="btn btn-warning btn-block">SubTasks</a></div>
        </div>
    </div>
</div>
{% endblock %}
