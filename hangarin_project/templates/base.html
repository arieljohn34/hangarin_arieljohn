{% load static %} <!-- 1. ADD THIS AT THE VERY TOP OF THE FILE -->
{% load pwa %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hangarin{% endblock %}</title>
    
    
    <!-- Bootstrap 4 CSS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Font Awesome (CDN) - For the Google/GitHub icons on login page -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- 2. ADD YOUR CUSTOM CSS HERE (with the ?v=2 cache buster) -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}?v=7">

    {% progressive_web_app_meta %}  
    
    {% block extra_head %}{% endblock %}
</head>
<body>
       <nav class="navbar navbar-dark bg-dark">
            <div class="container d-flex justify-content-between align-items-center">
                <a class="navbar-brand" href="{% url 'tasks:home' %}">Hangarin</a>
                
                <!-- PROFILE PICTURE (Only shows if logged in) -->
                {% if user.is_authenticated %}
                <a href="{% url 'tasks:profile' %}" title="View Profile">
                    <img src="{% static 'img/profile_default.jpg' %}" 
                        alt="Profile" 
                        class="rounded-circle profile-nav-img">
                </a>
                {% endif %}
            </div>
        </nav>
                     
        

    <!-- Main Content -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
