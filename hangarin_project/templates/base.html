{% load static %} <!-- 1. ADD THIS AT THE VERY TOP OF THE FILE -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hangarin{% endblock %}</title>
    
    <!-- Bootstrap 4 CSS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <!-- 2. ADD YOUR CUSTOM CSS HERE (with the ?v=2 cache buster) -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}?v=4">
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Simple Navbar with only brand -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'tasks:home' %}">Hangarin</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
