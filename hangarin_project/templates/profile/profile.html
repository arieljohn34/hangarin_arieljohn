{% extends 'base.html' %}
{% load static %}

{% block title %}My Profile - Hangarin{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header text-center">
                <h4 class="card-title mb-0">My Profile</h4>
            </div>
            <div class="card-body text-center">

                <!-- Profile Picture -->
                <img src="{% static 'img/profile_default.jpg' %}"
                     alt="Profile Picture"
                     class="rounded-circle mb-3 profile-main-img">

                <!-- User Info -->
                <h3>{{ request.user.username }}</h3>
                <p class="text-muted">{{ request.user.email }}</p>

                <hr>

                <!-- BIO FORM -->
                <form method="post" class="text-left">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_bio">Bio</label>
                        <textarea name="bio"
                                id="id_bio"
                                class="form-control"
                                rows="4"
                                maxlength="500"
                                placeholder="Tell us something about yourself...">{{ profile.bio }}</textarea>
                        <small class="form-text text-muted">Max 500 characters.</small>
                    </div>

                    <!-- Buttons row -->
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary" style="flex: 1; margin-right: 8px;">
                            Save Bio
                        </button>
                        <a href="{% url 'tasks:dashboard' %}" class="btn btn-success" style="flex: 1;">
                            Go to Dashboard
                        </a>
                    </div>
                </form>

                <hr>

</div>
{% endblock %}
