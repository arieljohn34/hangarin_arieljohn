{% extends 'base.html' %}
{% load static %}

{% block title %}My Profile - Hangarin{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header text-center">
                <h4 class="card-title mb-0">My Profile</h4>
            </div>
            <div class="card-body text-center">
                <!-- Profile Picture -->
                <img src="{% static 'img/profile_default.jpg' %}" 
                     alt="Profile Picture" 
                     class="rounded-circle mb-3 profile-main-img">
                
                <!-- Display the logged in user's details -->
                <h3>{{ request.user.username }}</h3>
                <p class="text-muted">{{ request.user.email }}</p>
                
                <!-- LOGOUT BUTTON -->
                <form method="post" action="{% url 'tasks:logout' %}" class="mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-round">Logout</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
